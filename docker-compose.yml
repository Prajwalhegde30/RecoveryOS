services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recoveryos
      POSTGRES_USER: recoveryos
      POSTGRES_PASSWORD: recoveryos
    ports:
      - '5432:5432'
    volumes:
      - recoveryos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recoveryos -d recoveryos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recoveryos-postgres:
